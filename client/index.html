<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Margin · Premium electronics</title>
    <meta
      name="description"
      content="Margin sells premium audio, phones, wearables and cameras. Premium tech, made simple."
    />
    <meta name="theme-color" content="#f7fbf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101712" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Margin" />
    <meta property="og:title" content="Margin · Premium electronics" />
    <meta property="og:description" content="Premium tech, made simple." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the stored theme before first paint so dark mode does not flash.
      try {
        const stored = localStorage.getItem('theme');
        const isDark = stored
          ? stored === 'dark'
          : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', isDark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
